<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres salir conmigo?</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Start Screen -->
    <div id="start-screen" class="start-screen">
        <button id="startBtn">Haz clic para una sorpresa 🎵</button>
    </div>

    <!-- Background Music Container -->
    <div id="music-container"></div>

    <!-- Clouds -->
    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="cloud three"></div>

    <div class="container">
        <h1>¿QUIERES SALIR CONMIGO?</h1>
        <div class="buttons">
            <button id="yesBtn">SI</button>
            <button id="noBtn">NO</button>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>Sabia que dirias que si ❤️</h2>
            <img src="kitten.png" alt="Gatito con flor">
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
